name: Build & push model API image

on:
  push:
    branches: [main]
  # Run manually (Actions tab -> "Run workflow"), e.g. after training a new model version.
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/digits-api

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Dockerfile downloads the latest registered model from DagsHub via MLflow.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            CACHEBUST=${{ github.run_id }}
          secrets: |
            dagshub_token=${{ secrets.DAGSHUB_TOKEN }}

      - name: Smoke test the /predict endpoint
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:latest"
          for i in $(seq 1 30); do
            if curl -sf -X POST http://localhost:8000/predict \
                 -H "Content-Type: application/json" \
                 -d @tests/sample_digit_0.json -o response.json; then
              break
            fi
            sleep 2
          done
          docker logs api
          cat response.json
          python3 -c "import json; r = json.load(open('response.json')); assert r['prediction'] == 0, r; print('OK:', r)"

      - name: Push the image to Docker Hub
        run: docker push --all-tags "$IMAGE"
